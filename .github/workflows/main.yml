name: Playmixo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create --platforms=android .
          grep -R "namespace" android/app/build.gradle.kts

      - name: Copy Firebase config
        run: |
          mkdir -p android/app
          cp "google-services (7).json" android/app/google-services.json
      - name: Get SHA-1
        run: |
          mkdir -p "$HOME/.config/.android"

          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cd android
          ./gradlew signingReport

      - name: Configure Kotlin
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.3.0"/' android/settings.gradle.kts
          fi

          if [ -f android/settings.gradle ]; then
            sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '2.3.0'/" android/settings.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/jvmTarget[[:space:]]*=/d' android/app/build.gradle.kts
            sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle.kts

            cat >> android/app/build.gradle.kts <<'EOF'

            kotlin {
            compilerOptions {
          jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
          }
          }
          EOF
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i '/jvmTarget[[:space:]]*=/d' android/app/build.gradle
            sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle
          fi
          sed -i 's/2.1.0/2.3.0/g' android/settings.gradle.kts
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle.kts
          sed -i '/jvmTarget = JavaVersion.VERSION_11.toString()/d' android/app/build.gradle.kts
      - name: Configure Google Services
        run: |
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services") version "4.4.3" apply false' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts 

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Playmixo Icon
        run: |
          mkdir -p assets

          cat > assets/playmixo_icon.svg <<'EOF'
          <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FFF2A6"/>
                <stop offset="30%" stop-color="#FFD84A"/>
                <stop offset="65%" stop-color="#D4AF37"/>
                <stop offset="100%" stop-color="#8B6508"/>
              </linearGradient>

              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#191919"/>
                <stop offset="100%" stop-color="#000000"/>
              </linearGradient>
            </defs>

            <rect width="1024" height="1024" rx="190" fill="url(#bg)"/>

            <rect
              x="35"
              y="35"
              width="954"
              height="954"
              rx="175"
              fill="none"
              stroke="url(#gold)"
              stroke-width="18"
            />

            <path
              d="M365 235 L410 145 L475 205 L512 125 L549 205 L614 145 L659 235 Z"
              fill="url(#gold)"
              stroke="#FFF0A0"
              stroke-width="5"
            />

            <text
              x="512"
              y="570"
              text-anchor="middle"
              font-family="DejaVu Sans"
              font-size="430"
              font-weight="900"
              fill="url(#gold)"
            >P</text>

            <path
              d="M485 360 L485 475 L575 417 Z"
              fill="#111111"
            />

            <ellipse
              cx="512"
              cy="500"
              rx="330"
              ry="105"
              fill="none"
              stroke="url(#gold)"
              stroke-width="24"
              transform="rotate(-12 512 500)"
            />

            <text
              x="512"
              y="720"
              text-anchor="middle"
              font-family="DejaVu Sans"
              font-size="105"
              font-weight="900"
              fill="url(#gold)"
            >PLAYMIXO</text>

            <text
              x="512"
              y="805"
              text-anchor="middle"
              font-family="DejaVu Sans"
              font-size="32"
              letter-spacing="8"
              fill="#FFFFFF"
            >PLAY • CONNECT • ENJOY</text>
          </svg>
          EOF

          convert -background none assets/playmixo_icon.svg -resize 1024x1024 assets/playmixo_icon.png

      - name: Add Launcher Icon Package
        run: flutter pub add --dev flutter_launcher_icons

      - name: Configure Playmixo App Icon
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/playmixo_icon.png"
            adaptive_icon_background: "#111111"
            adaptive_icon_foreground: "assets/playmixo_icon.png"
            min_sdk_android: 21
          EOF

      - name: Generate Playmixo App Icon
        run: dart run flutter_launcher_icons

      - name: Get Flutter packages
        run: flutter pub get

      - name: Clean Flutter Build
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: playmixo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
